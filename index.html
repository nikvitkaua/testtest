<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SLOTORADO</title>
    <link rel="stylesheet" href="./assets/css/style.css" />
  </head>
  <body>
    <main class="landing" id="landing">
      <!-- <img
        class="landing__bg"
        src="./assets/images/web/web_bg.jpg"
        alt=""
        width="430"
        height="932"
      /> -->

      <picture>
        <source
          media="(min-width: 768px)"
          srcset="./assets/images/web/web_coins.png"
        />
        <img
          class="landing__coins"
          src="./assets/images/mob/mob_coins.png"
          alt=""
          width="430"
          height="932"
        />
      </picture>

      <img
        src="./assets/images/mob/mob_coin.png"
        alt=""
        class="landing__coin"
      />

      <div class="wheel-wrap" id="wheelWrap">
        <div class="wheel">
          <div class="wheel__shadows">
            <span class="wheel__shadow wheel__shadow--left"></span>
            <span class="wheel__shadow wheel__shadow--right"></span>
            <span class="wheel__shadow wheel__shadow--main"></span>
          </div>

          <div class="wheel__inner" id="wheelInner">
            <picture>
              <source media="(max-width: 768px)" srcset="./assets/images/mob/mob_wheel_inner.png">
              <img class="wheel__disc" src="./assets/images/web/web_wheel_inner.png" alt="">
            </picture>
          </div>

          <picture>
            <source media="(max-width: 768px)" srcset="./assets/images/mob/mob_wheel_outer.png">
            <img class="wheel__outer" src="./assets/images/web/web_wheel_outer.png" alt="" width="600" height="600">
          </picture>

          <picture>
            <source media="(max-width: 768px)" srcset="./assets/images/mob/mob_wheel_pointer.png">
            <img class="wheel__pointer" src="./assets/images/web/web_wheel_pointer.png" alt="" width="120" height="120">
          </picture>

          <button class="wheel__btn" id="spinBtn" type="button" aria-label="Spin">
            <picture>
              <source media="(max-width: 768px)" srcset="./assets/images/mob/mob_wheel_button.png">
              <img src="./assets/images/web/web_wheel_button.png" alt="" width="120" height="120">
            </picture>
          </button>
        </div>
      </div>

      <div class="characters" id="characters">
        <img
          class="characters__man"
          src="./assets/images/mob/mob_man.png"
          alt=""
          width="400"
          height="500"
        />
        <img
          class="characters__raccoon"
          src="./assets/images/mob/mob_bandito.png"
          alt=""
          width="400"
          height="500"
        />
      </div>
    </main>

    <div class="prize-overlay" id="prizeOverlay" aria-hidden="true">
      <div class="prize-overlay__backdrop"></div>
      <div class="coin-rain" id="coinRain" aria-hidden="true"></div>

      <div class="prize-modal">
        <div class="prize-modal__frame-wrap">
          <img
            class="prize-modal__frame"
            src="./assets/images/mob/mob_reg_bg.png"
            alt=""
          />

          <div class="prize-modal__content">
            <img
              class="prize-modal__bonus"
              src="./assets/images/mob/mob_reg_bonus.png"
              alt="Your Gift 120% Bonus + 50 FS"
            />

            <form class="prize-form" id="prizeForm">
              <label class="prize-form__field" id="emailField">

                  name="email"

                  placeholder="Email"

              <label class="prize-form__terms">
                <input
                  class="prize-form__checkbox"
                  type="checkbox"
                  name="terms"
                  required
                  checked
                />

                <span class="prize-form__switch" aria-hidden="true"></span>

                <span class="prize-form__terms-text">
                  I am 18 years old.<br />
                  I accept
                  <a
                    href="https://slotorado.casino/en/privacy-mgmt-personal-data"
                    >Privacy Policy</a
                  >
                  and
                  <a href="https://slotorado.casino/en/terms-of-service"
                    >Terms and Conditions</a
                  ><br />
                  Get exclusive offers and promotions from Kraken
                </span>
              </label>

                class="prize-form__submit"
                type="submit"
                id="submitBtn"
                disabled
